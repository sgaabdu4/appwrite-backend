name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Set up Node.js 26 and pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: latest
          runtime: node@26
          install: false
      - name: Check JavaScript skill formatting
        run: >-
          pnpm dlx --package=@biomejs/biome@2.5.11 biome check
          --vcs-enabled=false
          --linter-enabled=false
          --assist-enabled=false
          --indent-style=space
          --line-width=140
          --javascript-formatter-quote-style=single
          skills/appwrite-backend/scripts
      - name: Run skill contracts
        run: >-
          node --test
          skills/appwrite-backend/scripts/appwrite-query-contract.test.mjs
          skills/appwrite-backend/scripts/appwrite-schema-guard.test.mjs
          skills/appwrite-backend/scripts/skill-safety-contract.test.mjs
          .github/workflows/quality-contract.test.mjs
