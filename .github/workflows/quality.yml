name: Quality

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  checks: read # Verify the installed Hard Eng release.

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      MISE_FETCH_REMOTE_VERSIONS_CACHE: 0s
      MISE_PREFER_OFFLINE: 'false'
      MISE_USE_VERSIONS_HOST: 'false'
      MISE_MINIMUM_RELEASE_AGE: 0s
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js 26 and pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: latest
          runtime: node@26
          install: false
      - name: Select isolated tool storage
        run: |
          {
            echo "MISE_DATA_DIR=$RUNNER_TEMP/hard-eng-tools/mise/data"
            echo "MISE_CACHE_DIR=$RUNNER_TEMP/hard-eng-tools/mise/cache"
            echo "MISE_STATE_DIR=$RUNNER_TEMP/hard-eng-tools/mise/state"
            echo "PNPM_CONFIG_STORE_DIR=$RUNNER_TEMP/hard-eng-tools/pnpm/store"
            echo "PNPM_CONFIG_CACHE_DIR=$RUNNER_TEMP/hard-eng-tools/pnpm/cache"
          } >> "$GITHUB_ENV"
      - name: Cache native tool downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/hard-eng-tools/mise/data/installs
            ${{ runner.temp }}/hard-eng-tools/mise-launcher
            ${{ runner.temp }}/hard-eng-tools/pnpm/store
          key: ${{ runner.os }}-${{ runner.arch }}-quality-tools-${{ hashFiles('.github/workflows/quality.yml', '.hooks/tool_setup.py', 'hard-eng.gates.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-quality-tools-
      - name: Run required checks
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          pnpm dlx --config.ignore-scripts=false --allow-build=@jdxcode/mise --package=@jdxcode/mise@latest mise --no-config install uv@latest python@3.12 node@26 &&
          MISE_FETCH_REMOTE_VERSIONS_CACHE=1h pnpm dlx --config.ignore-scripts=false --allow-build=@jdxcode/mise --package=@jdxcode/mise@latest mise --no-config exec uv@latest python@3.12 node@26 -- uv run --no-project --with pyyaml python .hooks/hard-eng.py check --base "$BASE_SHA"
